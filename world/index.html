<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Begum's World — coming soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a12;              /* the dark before the light */
      color: var(--color-bg);
      text-align: center;
    }
    .orb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #FFF2E0;
      box-shadow: 0 0 24px 8px rgb(252 163 17 / 0.45);
      margin: 0 auto var(--space-m);
      animation: breathe 2.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.35); opacity: 1; }
    }
    a { color: var(--color-accent); }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>The world is still being built.</h1>
    <p>Reach for the light — soon.</p>
    <p><a href="/cv/">← back to the classic version</a></p>
  </main>
</body>
</html>
